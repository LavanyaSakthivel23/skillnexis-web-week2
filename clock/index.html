<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital Clock &amp; Countdown</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Digital Clock &amp; Countdown Timer</h1>
  </header>

  <main>
    <section class="box">
      <h2>Current Time</h2>
      <div id="clock">00:00:00</div>
      <p id="date"></p>
    </section>

    <section class="box">
      <h2 id="countdown-title">Countdown to New Year</h2>
      <div class="countdown">
        <div><span id="days">0</span><small>Days</small></div>
        <div><span id="hours">0</span><small>Hours</small></div>
        <div><span id="minutes">0</span><small>Minutes</small></div>
        <div><span id="seconds">0</span><small>Seconds</small></div>
      </div>
    </section>

    <section class="box">
      <h2>Set Your Own Countdown</h2>
      <input type="datetime-local" id="target-date">
      <button id="set-btn">Start</button>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Lavanya S</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
